name: brep_mfr
channels:
  - pytorch
  - nvidia
  - dglteam/label/cu117
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=1.13.1
  - torchvision=0.14.1
  - torchaudio=0.13.1
  - pytorch-cuda=11.7
  - dgl=1.0.0
  - numpy=1.23.5
  - pip=23.3.1
  - pip:
      - fairseq==0.12.2
      - pytorch-lightning==1.7.1
      - torch-geometric==2.3.1
      - torchmetrics==0.8.0
      - tensorboardX
      - six
      - prefetch_generator
      - prettytable